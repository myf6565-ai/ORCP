#=============================================================================
# ORCP Flink log4j2 日志配置。
#
# 以滚动文件形式写入 /var/log/orcp/flink（由 30_install_flink.sh 软链接）。
# Spring 服务使用独立的 logback JSON 配置；Flink 按上游惯例使用 log4j2。
#=============================================================================
monitorInterval = 30

rootLogger.level = INFO
rootLogger.appenderRef.file.ref = MainFile

appender.main.type = RollingFile
appender.main.name = MainFile
appender.main.fileName = ${sys:log.file:-/var/log/orcp/flink/flink.log}
appender.main.filePattern = ${sys:log.file:-/var/log/orcp/flink/flink.log}.%d{yyyy-MM-dd}-%i
appender.main.append = true
appender.main.layout.type = PatternLayout
appender.main.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.main.policies.type = Policies
appender.main.policies.time.type = TimeBasedTriggeringPolicy
appender.main.policies.time.interval = 1
appender.main.policies.size.type = SizeBasedTriggeringPolicy
appender.main.policies.size.size = 100MB
appender.main.strategy.type = DefaultRolloverStrategy
appender.main.strategy.max = 14

# 屏蔽高噪声库，避免淹没业务日志。
logger.akka.name = akka
logger.akka.level = INFO
logger.kafka.name = org.apache.kafka
logger.kafka.level = INFO
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN
logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = WARN
logger.netty.name = org.jboss.netty
logger.netty.level = WARN
