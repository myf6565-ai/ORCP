# ORCP Prometheus 告警规则。
# 将本文件复制到 Prometheus rules 目录并在 prometheus.yml 中引用：
#
#   rule_files:
#     - /opt/prometheus/rules/orcp-alerts.yml
#
# 告警阈值来自 DEV_SPEC §8.6。for 持续时长足够跨越正常重启，
# 确保只对真实故障告警，而非滚动发布触发。

groups:
  - name: orcp.flink
    interval: 30s
    rules:
      # Flink 作业已停止运行超过 2 分钟。
      # flink_jobmanager_job_uptime 在作业存活时单调递增，作业失败时降为 0。
      - alert: OrcpFlinkJobDown
        expr: flink_jobmanager_job_uptime == 0
        for: 2m
        labels:
          severity: critical
          service: orcp-flink
        annotations:
          summary: "Flink 作业 {{ $labels.job_name }} 未在运行"
          description: |
            Flink 作业 {{ $labels.job_name }} 的 uptime 持续 2+ 分钟为 0。
            请检查 JobManager：http://{{ $labels.instance }}:8081/jobs/overview

      # 短时间内重启次数过多，通常意味着 fixed-delay 掩盖了持续性故障。
      - alert: OrcpFlinkJobRestartingRepeatedly
        expr: increase(flink_jobmanager_job_numRestarts_total[5m]) > 3
        for: 0m
        labels:
          severity: warning
          service: orcp-flink
        annotations:
          summary: "Flink 作业 {{ $labels.job_name }} 在 5 分钟内重启 > 3 次"
          description: |
            作业 {{ $labels.job_name }} 在过去 5 分钟内重启超过 3 次。
            可能原因：Schema 不匹配、DB 连接中断等持续性错误。

  - name: orcp.kafka
    interval: 30s
    rules:
      # 消费者积压阈值（DEV_SPEC §8.6）。
      # 如后续接入 kafka_exporter，可将指标替换为 kafka_consumergroup_lag。
      - alert: OrcpKafkaConsumerLagHigh
        expr: max by (job_name) (flink_taskmanager_job_task_operator_pendingRecords) > 10000
        for: 5m
        labels:
          severity: warning
          service: orcp-kafka
        annotations:
          summary: "作业 {{ $labels.job_name }} 的 Kafka 消费积压 > 10k 条"
          description: |
            作业 {{ $labels.job_name }} 的 Kafka Source 积压超过 10,000 条记录，
            且持续 5+ 分钟。请检查生产者速率与 TaskManager slot 数量是否匹配。

  - name: orcp.spring
    interval: 30s
    rules:
      - alert: OrcpSpringServiceDown
        expr: up{job="orcp-spring"} == 0
        for: 1m
        labels:
          severity: critical
          service: orcp-spring
        annotations:
          summary: "Spring 服务 {{ $labels.instance }} 已下线"
          description: |
            Prometheus 无法抓取 {{ $labels.instance }}（{{ $labels.job }}）超过 1 分钟。
            请检查：systemctl status orcp-ingest orcp-admin

      # OceanBase 写入失败率超过 1%（自定义 Micrometer 计数器）。
      - alert: OrcpIngestFailureRateHigh
        expr: |
          rate(orcp_ingest_persisted_total{result="failed"}[5m])
            /
          rate(orcp_ingest_received_total[5m])
            > 0.01
        for: 5m
        labels:
          severity: warning
          service: orcp-ingest
        annotations:
          summary: "orcp-ingest 失败率在 5 分钟内 > 1%"
          description: |
            超过 1% 的接收事件未能成功持久化/转发。
            请查看 /var/log/orcp/orcp-ingest.log 中的错误日志。
