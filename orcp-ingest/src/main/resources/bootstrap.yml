# Nacos 配置客户端需要在 Spring 上下文刷新之前激活，
# 因此必须放在 bootstrap.yml 中（而非 application.yml）。
spring:
  application:
    name: orcp-ingest
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:node-1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ORCP_GROUP
      config:
        server-addr: ${NACOS_SERVER:node-1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ORCP_GROUP
        file-extension: yaml
        refresh-enabled: true
