# 静态回退配置。运行时值（Kafka / DB 端点、密码）
# 在 bootstrap 阶段由 Nacos data-id "orcp-ingest.yaml" 覆盖。
#
# 以下默认值中以 ${VAR:default} 形式声明的项，
# 可直接通过系统环境变量覆盖，无需重新部署。

server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:node-1:9092,node-2:9092,node-3:9092}
    consumer:
      group-id: orcp-ingest
      enable-auto-commit: false
      max-poll-records: 500
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed    # 仅消费已提交的 Kafka 事务
    listener:
      ack-mode: MANUAL_IMMEDIATE           # 由 listener 显式提交 offset
      concurrency: 3                       # 并发线程数（与 topic 分区数对齐）
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://node-1:3306/orcp_detail?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&rewriteBatchedStatements=true}
    username: ${MYSQL_USER:orcp_rw}
    password: ${MYSQL_PASSWORD:ChangeMe_rw_1!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 900000
      pool-name: orcp-ingest-hikari

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: input     # 使用业务主键，禁用自增

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

orcp:
  kafka:
    src-topic: ${ORCP_SRC_TOPIC:orcp.src.demo}    # 外部源 topic
    mid-topic: ${ORCP_MID_TOPIC:orcp.mid.events}  # 内部转发 topic（Flink 消费）
    send-timeout-seconds: 10                       # 同步转发超时
  dedup:
    caffeine-max-size: 10000       # Caffeine LRU 缓存最大条目数
    caffeine-ttl-minutes: 10       # 写入后过期时间（分钟）
