apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
    spec:
      containers:
        - name: query-service
          image: your-registry/query-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: orcp-config
            - secretRef:
                name: orcp-secret
---
apiVersion: v1
kind: Service
metadata:
  name: query-service
spec:
  selector:
    app: query-service
  ports:
    - port: 8083
      targetPort: 8083
