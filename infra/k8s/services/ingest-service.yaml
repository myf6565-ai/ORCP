apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest-service
  template:
    metadata:
      labels:
        app: ingest-service
    spec:
      containers:
        - name: ingest-service
          image: your-registry/ingest-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: orcp-config
            - secretRef:
                name: orcp-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-service
spec:
  selector:
    app: ingest-service
  ports:
    - port: 8081
      targetPort: 8081
